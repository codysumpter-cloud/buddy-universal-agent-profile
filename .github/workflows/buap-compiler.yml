name: BUAP compiler

on:
  pull_request:
    paths:
      - "packages/buap-compiler/**"
      - "schemas/buap-*.schema.json"
      - ".github/workflows/buap-compiler.yml"
  push:
    branches: [main]
    paths:
      - "packages/buap-compiler/**"
      - "schemas/buap-*.schema.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test compiler
        working-directory: packages/buap-compiler
        run: npm test
      - name: Build deterministic example
        working-directory: packages/buap-compiler
        run: npm run build:example
      - name: Check generated drift
        working-directory: packages/buap-compiler
        run: npm run check:example
