name: Prismtek stack contract

on:
  push:
    paths:
      - "prismtek.component.json"
      - "linked-repos/prismtek-stack.manifest.json"
      - "schemas/prismtek-component.schema.json"
      - "scripts/validate-prismtek-stack.mjs"
      - ".github/workflows/prismtek-stack-contract.yml"
  pull_request:
    paths:
      - "prismtek.component.json"
      - "linked-repos/prismtek-stack.manifest.json"
      - "schemas/prismtek-component.schema.json"
      - "scripts/validate-prismtek-stack.mjs"
      - ".github/workflows/prismtek-stack-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate router declaration and topology
        run: node scripts/validate-prismtek-stack.mjs --workspace . --local-only

  public-stack-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: stack/buddy-universal-agent-profile
      - uses: actions/checkout@v4
        with:
          repository: codysumpter-cloud/knowledge-vault
          path: stack/knowledge-vault
      # buddy-brain, buddy-agent, and omni-buddy were consolidated into the
      # prismtek-apps monorepo and their repositories archived. Check out the
      # monorepo once and map each component to its path, instead of cloning
      # three archived repositories. prismtek-apps is private, so this job needs
      # a token with read access to it; without one the components are reported
      # as private and skipped rather than failing.
      - uses: actions/checkout@v4
        with:
          repository: codysumpter-cloud/prismtek-apps
          token: ${{ secrets.PRISMTEK_APPS_READ_TOKEN || github.token }}
          path: stack/prismtek-apps
        continue-on-error: true
      - name: Map consolidated components into the stack workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d stack/prismtek-apps ]; then
            echo "prismtek-apps was not checked out; consolidated components will be skipped as private."
            exit 0
          fi
          for pair in "buddy-brain:tools/buddy-brain" \
                      "buddy-agent:services/buddy-agent" \
                      "omni-buddy:services/omni-buddy"; do
            name="${pair%%:*}"; sub="${pair##*:}"
            mkdir -p "stack/$name"
            cp "stack/prismtek-apps/$sub/prismtek.component.json" "stack/$name/"
            echo "mapped $name <- prismtek-apps/$sub"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public repository contracts
        run: node stack/buddy-universal-agent-profile/scripts/validate-prismtek-stack.mjs --workspace stack
