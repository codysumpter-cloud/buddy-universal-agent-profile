name: BUAP Conformance

on:
  pull_request:
    paths:
      - '**.md'
      - '**.json'
      - 'scripts/**'
      - 'plugins/**'
      - '.github/workflows/buap-conformance.yml'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.json'
      - 'scripts/**'
      - 'plugins/**'
      - '.github/workflows/buap-conformance.yml'

jobs:
  buap-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run BUAP conformance check
        run: node scripts/buap-conformance-check.mjs
      - name: Run BUAP deep lint (plugin manifests, frontmatter, links, tier invariants)
        run: node scripts/buap-lint.mjs
